server.port=8080
####################Data source#######################
spring.data.mongodb.host=${MONGO_HOST:localhost}
spring.data.mongodb.port=${MONGO_PORT:27017}
spring.data.mongodb.database=${MONGO_DB:youtube-clone}
####################AWS#######################
cloud.aws.region.static=${AWS_REGION:us-east-1}
cloud.aws.bucket.name=${AWS_BUCKET_NAME:youtube-mostafa}
spring.cloud.aws.region.static=${AWS_REGION:us-east-1}
spring.cloud.aws.credentials.access-key=${AWS_ACCESS_KEY}
spring.cloud.aws.credentials.secret-key=${AWS_SECRET_KEY}
####################Files#######################
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
####################Upload Limits#######################
upload.video.max-size-mb=50
upload.thumbnail.max-size-mb=5
upload.max-videos-per-user=2
####################Security#######################
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH0_ISSUER_URI:https://mostafa-youtube-clone.us.auth0.com/}
auth0.audience=${AUTH0_AUDIENCE:http://localhost:8080}
auth0.userInfoEndPoint=${AUTH0_USERINFO_ENDPOINT:https://mostafa-youtube-clone.us.auth0.com/userinfo}
